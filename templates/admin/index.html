{% extends "admin/base_site.html" %}
{% load static %}

{% block content %}

<div class="container-fluid">

  <!-- KPI ROW -->
  <div class="row mb-4">

    <div class="col-lg-3 col-md-6">
      <div class="card text-center">
        <div class="card-body">
          <small class="text-muted">Total Users</small>
          <h2 class="fw-bold">{{ total_users }}</h2>
        </div>
      </div>
    </div>

    <div class="col-lg-3 col-md-6">
      <div class="card text-center">
        <div class="card-body">
          <small class="text-muted">Total Berita</small>
          <h2 class="fw-bold">{{ total_berita }}</h2>
        </div>
      </div>
    </div>

    <div class="col-lg-3 col-md-6">
      <div class="card text-center">
        <div class="card-body">
          <small class="text-muted">Admin Aktif</small>
          <h2 class="fw-bold">{{ staff_count }}</h2>
        </div>
      </div>
    </div>

    <div class="col-lg-3 col-md-6">
      <div class="card text-center">
        <div class="card-body">
          <small class="text-muted">Last Login</small>
          <h6>{{ request.user.last_login|date:"d M Y H:i" }}</h6>
        </div>
      </div>
    </div>

  </div>

  <!-- DEFAULT DJANGO ADMIN APP LIST -->
  <div class="row">
    <div class="col-12">
      {{ block.super }}
    </div>
  </div>

</div>

{% endblock %}
